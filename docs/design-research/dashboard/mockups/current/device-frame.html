<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device frame</title>
<!--
  Generic, unbranded laptop + phone frames (pure CSS).
  URL params:
    layout = laptop | phone | combo
    d      = desktop screenshot path (1440x900 @2x)
    m      = mobile screenshot path  (390x844 @2x)
    bg     = 0 for a transparent background (default: soft studio background)
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #stage{display:inline-flex;align-items:flex-end;justify-content:center;padding:90px 110px 110px;position:relative}
  #stage.bg{background:radial-gradient(120% 90% at 50% 0%,#f7f8fa 0%,#e9ecf1 55%,#dde1e8 100%)}
  #stage.bg::after{content:"";position:absolute;left:8%;right:8%;bottom:70px;height:40px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(15,23,42,.22),rgba(15,23,42,0));filter:blur(6px);z-index:0}

  /* ---------- Laptop ---------- */
  .laptop{position:relative;width:1200px;z-index:1}
  .lid{position:relative;margin:0 auto;width:1200px;padding:28px 26px 30px;border-radius:26px 26px 6px 6px;
    background:linear-gradient(180deg,#2a2b2f 0%,#1a1b1e 100%);
    box-shadow:inset 0 0 0 2px #3a3b40,inset 0 0 0 3px #111,0 30px 60px -20px rgba(15,23,42,.35)}
  .lid::before{content:"";position:absolute;top:11px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#3c4a63,#0b0d12 70%);box-shadow:0 0 0 2px #24252a}
  .screen{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:4px;background:#fff}
  .screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left}
  .screen::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 38%)}
  .base{position:relative;width:1380px;margin-left:-90px;height:24px;border-radius:2px 2px 22px 22px;
    background:linear-gradient(180deg,#e7e8eb 0%,#c9cbd0 45%,#a7aab0 100%);
    box-shadow:inset 0 1px 0 #f7f7f8,0 18px 30px -12px rgba(15,23,42,.45)}
  .base::before{content:"";position:absolute;top:0;left:50%;width:190px;height:10px;margin-left:-95px;border-radius:0 0 12px 12px;
    background:linear-gradient(180deg,#b9bbc0,#d6d8dc)}
  .base::after{content:"";position:absolute;bottom:-5px;left:6%;right:6%;height:5px;border-radius:0 0 50% 50%;background:#8d9096}

  /* ---------- Phone ---------- */
  .phone{position:relative;width:418px;height:872px;padding:14px;border-radius:62px;z-index:2;
    background:linear-gradient(145deg,#2c2d31,#121316);
    box-shadow:inset 0 0 0 2px #45464c,inset 0 0 0 6px #0c0c0e,0 40px 70px -20px rgba(15,23,42,.45),0 10px 20px -8px rgba(15,23,42,.3)}
  .phone .btn{position:absolute;width:4px;border-radius:2px;background:#2a2b2f}
  .phone .b1{left:-4px;top:170px;height:34px}.phone .b2{left:-4px;top:230px;height:64px}.phone .b3{left:-4px;top:306px;height:64px}
  .phone .b4{right:-4px;top:250px;height:100px}
  .pscreen{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .status{flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 36px;font-size:16px;font-weight:600;color:#0b0b0b;background:#fff;position:relative}
  .island{position:absolute;top:12px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#050506}
  .icons{display:flex;gap:6px;align-items:center}
  .icons svg{display:block}
  .pscreen img{display:block;width:100%;flex:1 1 auto;min-height:0;object-fit:cover;object-position:top left}
  .home{position:absolute;bottom:9px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111;opacity:.85}

  /* ---------- Combo ---------- */
  .combo{position:relative;display:flex;align-items:flex-end}
  .combo .phone{position:absolute;right:-70px;bottom:-34px;transform:scale(.78);transform-origin:bottom right}
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const q = new URLSearchParams(location.search);
  const layout = q.get('layout') || 'laptop';
  const d = q.get('d') || 'sources/desktop-dashboard.png';
  const m = q.get('m') || 'sources/mobile-dashboard.png';
  const stage = document.getElementById('stage');
  if (q.get('bg') !== '0') stage.classList.add('bg');

  const laptop = () => `
    <div class="laptop"><div class="lid"><div class="screen"><img src="${d}" alt="Écran ordinateur"></div></div><div class="base"></div></div>`;
  const phone = () => `
    <div class="phone"><span class="btn b1"></span><span class="btn b2"></span><span class="btn b3"></span><span class="btn b4"></span>
      <div class="pscreen">
        <div class="status"><span>9:41</span><span class="island"></span>
          <span class="icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5Zm-4.2-4.3L2.2 5.6a8.2 8.2 0 0 1 11.6 0l-1.6 1.6a5.9 5.9 0 0 0-8.4 0ZM.6 4 -.9 2.4a12.6 12.6 0 0 1 17.8 0L15.4 4a10.4 10.4 0 0 0-14.8 0Z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0b0b0b" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><rect x="25" y="4.5" width="1.5" height="4" rx=".75" opacity=".4"/></svg>
          </span></div>
        <img src="${m}" alt="Écran mobile">
        <span class="home"></span>
      </div></div>`;

  stage.innerHTML = layout === 'phone' ? phone() : layout === 'combo' ? `<div class="combo">${laptop()}${phone()}</div>` : laptop();
  Promise.all([...document.images].map((i) => i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; })))
    .then(() => { document.documentElement.dataset.ready = '1'; });
</script>
</body>
</html>
