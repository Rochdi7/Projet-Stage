<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device models</title>
<!--
  Unbranded device mockup models (pure CSS, no manufacturer logos).
  ?model= laptop | browser | browser-full | tablet | phone | phones-trio | combo | family | perspective
  ?bg=0  transparent background
  Sources (2x captures): sources/desktop.png, desktop-full.png, tablet.png, mobile.png, mobile-full.png
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #stage{position:relative;display:inline-block;padding:90px 110px 120px}
  #stage.bg{background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef3 55%,#dfe3ea 100%)}
  #stage.bg.warm{background:radial-gradient(120% 100% at 30% 0%,#fff6ea 0%,#f6efe6 45%,#e9e4dc 100%)}
  .floor{position:absolute;left:10%;right:10%;bottom:78px;height:46px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(15,23,42,.24),rgba(15,23,42,0));filter:blur(7px)}
  #stage:not(.bg) .floor{display:none}
  .row{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:56px;z-index:1}

  /* Laptop */
  .laptop{position:relative;width:1200px}
  .lid{position:relative;width:1200px;padding:28px 26px 30px;border-radius:26px 26px 6px 6px;
    background:linear-gradient(180deg,#2a2b2f,#1a1b1e);box-shadow:inset 0 0 0 2px #3a3b40,inset 0 0 0 3px #111}
  .lid::before{content:"";position:absolute;top:11px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#3c4a63,#0b0d12 70%);box-shadow:0 0 0 2px #24252a}
  .screen{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:4px;background:#fff}
  .screen img,.tscreen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left}
  .glare::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.10),rgba(255,255,255,0) 38%)}
  .base{position:relative;width:1380px;margin-left:-90px;height:24px;border-radius:2px 2px 22px 22px;
    background:linear-gradient(180deg,#e7e8eb,#c9cbd0 45%,#a7aab0);box-shadow:inset 0 1px 0 #f7f7f8,0 18px 30px -12px rgba(15,23,42,.45)}
  .base::before{content:"";position:absolute;top:0;left:50%;width:190px;height:10px;margin-left:-95px;border-radius:0 0 12px 12px;background:linear-gradient(180deg,#b9bbc0,#d6d8dc)}

  /* Phone */
  .phone{position:relative;width:418px;height:872px;padding:14px;border-radius:62px;flex:none;
    background:linear-gradient(145deg,#2c2d31,#121316);
    box-shadow:inset 0 0 0 2px #45464c,inset 0 0 0 6px #0c0c0e,0 40px 70px -20px rgba(15,23,42,.45),0 10px 20px -8px rgba(15,23,42,.3)}
  .phone .k{position:absolute;width:4px;border-radius:2px;background:#2a2b2f}
  .k1{left:-4px;top:170px;height:34px}.k2{left:-4px;top:230px;height:64px}.k3{left:-4px;top:306px;height:64px}.k4{right:-4px;top:250px;height:100px}
  .pscreen{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .status{flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 36px;font-size:16px;font-weight:600;color:#0b0b0b;background:#fff;position:relative;z-index:2}
  .island{position:absolute;top:12px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#050506}
  .icons{display:flex;gap:6px;align-items:center}
  .pview{position:relative;flex:1 1 auto;overflow:hidden}
  .pview img{position:absolute;left:0;top:0;width:100%;height:auto;display:block}
  .home{position:absolute;bottom:9px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111;opacity:.85;z-index:3}

  /* Tablet (landscape) */
  .tablet{position:relative;padding:24px;border-radius:40px;background:linear-gradient(145deg,#2c2d31,#141518);flex:none;
    box-shadow:inset 0 0 0 2px #45464c,inset 0 0 0 5px #0c0c0e,0 40px 70px -24px rgba(15,23,42,.45)}
  .tablet::before{content:"";position:absolute;left:10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#0b0d12;box-shadow:0 0 0 1.5px #2a2b30}
  .tscreen{position:relative;width:944px;aspect-ratio:1180/820;border-radius:16px;overflow:hidden;background:#fff}

  /* Browser window */
  .browser{width:1440px;border-radius:14px;overflow:hidden;background:#fff;
    box-shadow:0 0 0 1px rgba(15,23,42,.10),0 50px 90px -30px rgba(15,23,42,.45),0 18px 36px -18px rgba(15,23,42,.25)}
  .chrome{height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#f1f2f5;border-bottom:1px solid #e2e4e9}
  .dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
  .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
  .nav{display:flex;gap:14px;color:#8a8f99;font-size:16px}
  .url{flex:1;max-width:620px;margin:0 auto;height:32px;border-radius:9px;background:#fff;border:1px solid #e2e4e9;display:flex;align-items:center;justify-content:center;gap:8px;color:#4b5160;font-size:13.5px}
  .url svg{opacity:.55}
  .bview{position:relative;width:1440px;height:900px;overflow:hidden}
  .bview img{display:block;width:100%;height:auto}
  .browser.full .bview{height:auto}

  /* Compositions */
  .combo{position:relative}
  .combo .phone{position:absolute;right:-70px;bottom:-34px;transform:scale(.78);transform-origin:bottom right}
  .family{position:relative;width:1700px;height:820px}
  .family .laptop{position:absolute;left:250px;bottom:0}
  .family .tablet{position:absolute;left:0;bottom:6px;transform:scale(.62);transform-origin:bottom left;z-index:2}
  .family .phone{position:absolute;right:-10px;bottom:-10px;transform:scale(.7);transform-origin:bottom right;z-index:3}
  .persp{position:relative;width:1700px;height:930px;perspective:2600px}
  .persp .flat{position:absolute;left:40px;top:40px;width:1380px;border-radius:14px;overflow:hidden;background:#fff;
    transform:rotateX(14deg) rotateY(-20deg) rotateZ(5deg);transform-origin:center;
    box-shadow:0 0 0 1px rgba(15,23,42,.08),-40px 70px 120px -30px rgba(15,23,42,.45)}
  .persp .flat img{display:block;width:100%;height:auto}
  .persp .phone{position:absolute;right:30px;bottom:-70px;transform:rotateX(14deg) rotateY(-20deg) rotateZ(5deg) scale(.82)}
</style>
</head>
<body>
<div id="stage"><div class="floor"></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const model = q.get('model') || 'laptop';
  const S = `${q.get('p') || 'dashboard'}/sources/`;
  const stage = document.getElementById('stage');
  if (q.get('bg') !== '0') stage.classList.add('bg');
  if (q.get('warm') === '1') stage.classList.add('warm');

  const statusIcons = `<span class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5Zm-4.2-4.3L2.2 5.6a8.2 8.2 0 0 1 11.6 0l-1.6 1.6a5.9 5.9 0 0 0-8.4 0ZM.6 4-.9 2.4a12.6 12.6 0 0 1 17.8 0L15.4 4a10.4 10.4 0 0 0-14.8 0Z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0b0b0b" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><rect x="25" y="4.5" width="1.5" height="4" rx=".75" opacity=".4"/></svg></span>`;

  const laptop = () => `<div class="laptop"><div class="lid"><div class="screen glare"><img src="${S}desktop.png" alt=""></div></div><div class="base"></div></div>`;
  const phone = (src = 'mobile.png', offset = 0) => `<div class="phone"><span class="k k1"></span><span class="k k2"></span><span class="k k3"></span><span class="k k4"></span>
      <div class="pscreen"><div class="status"><span>9:41</span><span class="island"></span>${statusIcons}</div>
      <div class="pview"><img src="${S}${src}" style="top:${-offset}px" alt=""></div><span class="home"></span></div></div>`;
  const tablet = () => `<div class="tablet"><div class="tscreen glare"><img src="${S}tablet.png" alt=""></div></div>`;
  const lock = `<svg width="12" height="14" viewBox="0 0 12 14"><rect x="1" y="6" width="10" height="7.5" rx="1.5" fill="#4b5160"/><path d="M3.2 6V4.2a2.8 2.8 0 0 1 5.6 0V6" fill="none" stroke="#4b5160" stroke-width="1.6"/></svg>`;
  const browser = (full) => `<div class="browser ${full ? 'full' : ''}"><div class="chrome"><span class="dots"><i></i><i></i><i></i></span>
      <span class="nav">‹ ›</span><div class="url">${lock}<span>exemple.com/admin/${q.get('p') || 'dashboard'}</span></div><span style="width:60px"></span></div>
      <div class="bview"><img src="${S}${full ? 'desktop-full.png' : 'desktop.png'}" alt=""></div></div>`;

  const models = {
    laptop: () => `<div class="row">${laptop()}</div>`,
    browser: () => `<div class="row">${browser(false)}</div>`,
    'browser-full': () => `<div class="row">${browser(true)}</div>`,
    tablet: () => `<div class="row">${tablet()}</div>`,
    phone: () => `<div class="row">${phone()}</div>`,
    'phones-trio': () => `<div class="row" style="align-items:center">${[0, 0.42, 0.84].map((f) => phone('mobile-full.png', 0).replace('<img ', `<img data-frac="${f}" `)).join('')}</div>`,
    combo: () => `<div class="row"><div class="combo">${laptop()}${phone()}</div></div>`,
    family: () => `<div class="row"><div class="family">${laptop()}${tablet()}${phone()}</div></div>`,
    perspective: () => `<div class="row"><div class="persp"><div class="flat"><img src="${S}desktop.png" alt=""></div>${phone()}</div></div>`,
  };
  stage.insertAdjacentHTML('beforeend', (models[model] || models.laptop)());
  const imgs = [...document.images];
  Promise.all(imgs.map((i) => i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; })))
    .then(() => {
      // phones-trio: scroll each phone to a fraction of the page's scrollable height
      document.querySelectorAll('img[data-frac]').forEach((i) => {
        const cssH = i.naturalHeight * (390 / i.naturalWidth), viewH = i.parentElement.clientHeight;
        i.style.top = `${-Math.round(Math.max(0, cssH - viewH) * parseFloat(i.dataset.frac))}px`;
      });
      document.documentElement.dataset.ready = '1';
    });
</script>
</body>
</html>
